<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="src/style.css">
  <title>bank-template</title>
</head>

<body>
  <!-- Main container -->
  <div class="max-w-[400px] h-screen mx-auto p-2">
    <!-- Content wrapper -->
    <div class="relative h-full pt-10">
      <!-- Top question mark -->
      <div class="text-end">
        <a href="#">
          <i class="fa-solid fa-circle-question fa-xl text-blue-500"></i>
        </a>
      </div>

      <!-- Logo, Inputs, Button, Troubleshooting wrapper -->
      <div class="flex flex-col items-center gap-y-8 mt-[5rem]">
        <!-- Logo -->
        <img class="w-[100px]" src="logo.png" alt="logo">
        <!-- Inputs section -->
        <div class="border-3 border-gray-200 focus-within:ring-3 focus-within:ring-blue-500 rounded-lg bg-gray-200 px-3">
          <input type="text" placeholder="نام کاربری" class="w-full py-4 border-b border-b-gray-300 focus:outline-none">
          <input type="text" placeholder="رمز عبور" class="w-full py-4 focus:outline-none">
        </div>
        <!-- Login button -->
        <button class="w-full bg-[#bfccd4] border-[#bfc6ce] py-3 text-white rounded-xl cursor-pointer">ورود به
          بلو</button>
        <!-- Troubleshooting -->
        <span class="text-blue-500 font-semibold cursor-pointer">نمی توانید وارد شوید؟</span>
      </div>

      <!-- Footer app version -->
      <span class="absolute bottom-10 right-1/2 translate-x-1/2 text-gray-500">Version&nbsp;3.6.0</span>
    </div>
</body>
</html>
