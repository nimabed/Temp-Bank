<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="src/style.css">
  <title>Login</title>
</head>

<body>
  <!-- Main container -->
  <div class="max-w-[450px] h-screen mx-auto py-2 px-4 bg-gray-100/40">
    <!-- Content wrapper -->
    <div class="relative h-full pt-10 ">
      <!-- Top question mark -->
      <div class="text-end">
        <a href="#">
          <i class="fa-solid fa-circle-question fa-xl text-blue-500"></i>
        </a>
      </div>
      <!-- Logo, Inputs, Button, Troubleshooting wrapper -->
      <div class="flex flex-col items-center gap-y-8 mt-[5rem]">
        <!-- Logo -->
        <img class="w-[120px]" src="logo.png" alt="logo">
        <!-- Inputs section -->
        <div id="inputsWrapper" class="relative border-3 border-gray-100 rounded-lg bg-gray-100 px-3 ring-blue-500">
          <input id="username" type="text" placeholder="نام کاربری" class="w-full py-4 border-b border-b-gray-200 focus:outline-none font-vazir text-[17px]">
          <input id="password" type="password" placeholder="رمز عبور" class="w-full py-4 -mt-1 focus:outline-none font-vazir text-[17px]">
          <img id="toggleIcon" src="eye.png" alt="eye-icon" class="absolute left-0 bottom-2 w-8 ml-2 cursor-pointer hidden">
        </div>
        <!-- Auth error message -->
         <span id="errorMsg" class="hidden self-start -mt-5 mr-3 font-vazir text-red-500">نام کاربری لازم است</span>

        <!-- Login button -->
        <button id="loginBtn" class="w-full noFingerprint border-[#bfc6ce] text-white rounded-xl cursor-pointer font-vazir font-bold text-[17px]">
          <span id="btnIcon" class="pt-2 hidden">
            <i class="fa-solid fa-fingerprint fa-lg"></i>
          </span>
          <span id="btnText">ورود به بلو</span>
        </button>
        <!-- Troubleshooting -->
        <span class="text-blue-500 cursor-pointer font-vazir font-bold text-[17px]">نمی&zwnj;توانید وارد شوید؟</span>
      </div>

      <!-- Footer app version -->
      <span class="absolute bottom-10 right-1/2 translate-x-1/2 text-gray-500">Version&nbsp;3.6.0</span>
    </div>
    <script src="./src/login.js"></script>
</body>
</html>
